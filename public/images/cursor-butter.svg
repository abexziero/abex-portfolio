<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="128 128 308 308">
<defs><filter id="colour" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
<feMorphology in="SourceAlpha" operator="dilate" radius="12" result="outline"/>
<feFlood flood-color="#0D2118" result="ink"/><feComposite in="ink" in2="outline" operator="in" result="edge"/>
<feFlood flood-color="#F0CE72" result="butter"/><feComposite in="butter" in2="SourceAlpha" operator="in" result="fill"/>
<feMerge><feMergeNode in="edge"/><feMergeNode in="fill"/></feMerge></filter></defs>
<image x="0" y="0" width="512" height="512" href="data:image/png;base64," filter="url(#colour)"/>
</svg>