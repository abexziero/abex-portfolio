name: Deploy portfolio to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://abexziero.pages.dev
      PORTFOLIO_RELEASE: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test content
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build Cloudflare release
        run: npm run build:release

      - name: Typecheck
        run: npm run typecheck

      - name: Check deployment credentials
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build passed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets to enable deployment."
            echo "Deployment skipped: configure Cloudflare Actions secrets, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy out --project-name abexziero --branch main

      - name: Verify public routes
        if: steps.credentials.outputs.ready == 'true'
        shell: pwsh
        run: |
          @{ project = "abexziero"; url = $env:SITE_URL; production_branch = "main"; status = "deployed" } | ConvertTo-Json | Set-Content -LiteralPath "release-cloudflare.json" -Encoding UTF8
          ./scripts/verify-cloudflare.ps1
