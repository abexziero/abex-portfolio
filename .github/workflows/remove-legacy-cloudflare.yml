name: Remove legacy Cloudflare project

on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-legacy-cloudflare.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  remove-legacy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current site and remove only legacy project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFile } from "node:fs/promises";
          const current = "abexziero";
          const legacy = "abexziero-portfolio";
          assert.notEqual(current, legacy);
          const account = process.env.CF_ACCOUNT_ID?.trim();
          const token = process.env.CF_API_TOKEN?.trim();
          assert.match(account ?? "", /^[a-f0-9]{32}$/i, "Missing/invalid account ID");
          assert.ok(token, "Missing Cloudflare token");
          const api = async (name, method = "GET") => {
            const response = await fetch("https://api.cloudflare.com/client/v4/accounts/" + account + "/pages/projects/" + name, {
              method, headers: { Authorization: "Bearer " + token }, signal: AbortSignal.timeout(20000)
            });
            if (response.status === 404 && method === "GET") return null;
            const data = await response.json();
            assert.ok(response.ok && data.success, "Cloudflare request failed: HTTP " + response.status);
            return data.result;
          };
          const healthy = async () => {
            const response = await fetch("https://abexziero.pages.dev/id", { signal: AbortSignal.timeout(20000) });
            assert.equal(response.status, 200, "Current site must be healthy before/after cleanup");
          };
          const live = await api(current);
          assert.equal(live?.name, current);
          assert.equal(live?.subdomain, "abexziero.pages.dev");
          await healthy();
          const old = await api(legacy);
          if (old) {
            assert.equal(old.name, legacy);
            assert.equal(old.subdomain, "abexziero-portfolio.pages.dev");
            assert.notEqual(old.id, live.id);
            assert.ok((old.domains ?? []).every(domain => domain.endsWith(".pages.dev")), "Unexpected custom domain; cleanup stopped");
            console.log("Deleting only: " + legacy);
            await api(legacy, "DELETE");
            let removed = false;
            for (let attempt = 0; attempt < 5; attempt++) {
              if (await api(legacy) === null) { removed = true; break; }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            assert.ok(removed, "Legacy project deletion has not been confirmed");
            console.log("Confirmed removed: " + legacy);
          } else {
            console.log("Legacy project already absent in configured account");
          }
          const preserved = await api(current);
          assert.equal(preserved?.id, live.id, "Current project must remain unchanged");
          await healthy();
          console.log("Confirmed current site preserved: https://abexziero.pages.dev");
          await appendFile(process.env.GITHUB_STEP_SUMMARY, "Legacy project abexziero-portfolio absent; current project abexziero preserved and /id returns200.\n");
          NODE
